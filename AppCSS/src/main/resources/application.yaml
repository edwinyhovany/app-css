spring:
  application:
    name: ccs-vehicle-monitoring
    
  # Datasource PRINCIPAL (operacional)
  datasource:
    url: jdbc:postgresql://localhost:5432/ccs_db?currentSchema=operational
    username: ccs_user
    password: ccs_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: OperationalPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      
  # JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway maneja el schema
    properties:
      hibernate:
        default_schema: operational
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 100
          order_inserts: true
          order_updates: true
        format_sql: false
        show_sql: false
    open-in-view: false
    
  # Flyway Migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public, operational, telemetry
    default-schema: public
    
  # RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        default-requeue-rejected: false
        
  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
          
# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
        
# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    
# Application Properties
app:
  signal-processing:
    emergency-timeout-ms: 2000
    batch-size: 100
  cache:
    ttl-minutes: 10
    
# Logging
logging:
  level:
    root: INFO
    com.ccs.monitoring: DEBUG
    org.springframework.amqp: INFO
    org.hibernate.SQL: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"